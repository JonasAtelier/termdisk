[package]
name = "termdisk"
version = "0.2.0"
edition = "2021"
rust-version = "1.93"
description = "A disk usage analyzer with a treemap, in the terminal"
repository = "https://github.com/JonasAtelier/termdisk"
license = "GPL-3.0-only"
readme = "README.md"
keywords = ["disk-usage", "treemap", "tui", "terminal", "du"]
categories = ["command-line-utilities", "filesystem"]
# The crate: the code, its tests, its docs; not the benchmark and smoke scripts.
include = ["src/**", "tests/**", "examples/**", "LICENSE", "THIRD-PARTY-LICENSES", "README.md", "CHANGELOG.md"]

[dependencies]
# The system calls (sys.rs, trash.rs), getpwuid_r, statvfs, localtime_r, signal masks.
libc = "0.2"
# The view draws into a ratatui Buffer (library); the CLI runs the terminal. crossterm comes
# re-exported as ratatui::crossterm, the version termcode has.
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
# Cell widths of names (CJK) when cutting them to fit; already in ratatui's tree.
unicode-width = "0.2"
