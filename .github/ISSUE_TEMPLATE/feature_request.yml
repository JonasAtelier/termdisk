name: Feature request
description: Something termdisk could do, or do better.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you are trying to do
      description: The task, and where termdisk gets in the way or falls short today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: How you picture it working, in the view or on the command line.
    validations:
      required: true
  - type: textarea
    id: other
    attributes:
      label: Anything else
      description: How you work around it now, or another tool that does it well.
