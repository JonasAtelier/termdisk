# A release, run when a version tag is pushed on main (git tag v0.2.1 && git push origin
# v0.2.1): ci.yml's checks on that commit; the tag must name Cargo.toml's version, be on
# main, and CHANGELOG.md must date it; the `crates-io` environment must require a reviewer;
# then, once the owner approves, `cargo publish`, and a GitHub Release with that version's
# CHANGELOG section, the Linux binaries (x86_64, aarch64) and their SHA256SUMS.
#
# Run from the Actions tab (workflow_dispatch), on a branch or on a tag, it only checks (the
# checks and the environment) and builds the binaries, which stay on the run's page: every
# publishing job requires a tag *push*.
#
# Setup (the environment, its reviewer, crates.io's Trusted Publishing configuration):
# AGENTS.md, "Releases". No token is stored: the publish job gets one from crates.io for 30
# minutes. A partial release (published, no GitHub Release) is finished with "Re-run failed
# jobs", which leaves the publish alone.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  # The `crates-io` environment must make a person approve. crates.io's Trusted Publishing
  # configuration names this environment, so only a job in it can get a token; this job makes
  # sure the environment still needs a person (a job naming an environment that does not exist
  # creates it, unprotected). No token here, and it fails closed: an environment it cannot
  # read, or without a required reviewer, stops the release before the approval prompt. It runs
  # from the Actions tab too, to check the setup before a tag.
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read # reading an environment (GET /repos/{repo}/environments/{name})
    steps:
      - name: The crates-io environment requires a reviewer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rules=$(gh api "repos/$GITHUB_REPOSITORY/environments/crates-io" --jq '.protection_rules[]?.type') ||
            { echo "::error::cannot read the crates-io environment (missing, or no permission)"; exit 1; }
          grep -qx required_reviewers <<< "$rules" ||
            { echo "::error::the crates-io environment has no required reviewer: set it up as AGENTS.md says"; exit 1; }
          echo "crates-io: a reviewer must approve"

  tag:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # main's history, for the check below

      - name: The tag names Cargo.toml's version, is on main, and CHANGELOG.md dates it
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          test "v$version" = "$GITHUB_REF_NAME" || { echo "::error::tag $GITHUB_REF_NAME, Cargo.toml $version"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }
          head=$(grep -m1 "^## \[$version\]" CHANGELOG.md) || { echo "::error::CHANGELOG.md has no ## [$version] section"; exit 1; }
          if grep -qi unreleased <<< "$head"; then echo "::error::CHANGELOG.md: date the $version section"; exit 1; fi
          awk -v h="## [$version]" 'index($0, h) == 1 { on = 1; next } /^## \[/ { on = 0 } on' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md" || { echo "::error::the $version section is empty"; exit 1; }
          # The publish job's Rust is the one ci.yml's dry run used.
          pin() { grep -oE 'RUSTUP_TOOLCHAIN: [0-9][0-9.]*' "$1" | sort -u || true; }
          rust=$(pin .github/workflows/ci.yml)
          test -n "$rust" && test "$rust" = "$(pin .github/workflows/release.yml)" ||
            { echo "::error::ci.yml and release.yml pin different Rust"; exit 1; }
          echo "termdisk $version: tag, main and CHANGELOG agree; $rust"

  # crates.io, after the owner's click: the `crates-io` environment requires their review
  # and only v* tags may use it. Trusted Publishing: crates.io takes GitHub's OIDC token for
  # this workflow file in this environment and gives back a token for 30 minutes, which the
  # auth action's post step revokes when the job ends, failed or not.
  #
  # id-token: write lets any step of this job ask GitHub for such an OIDC token, so nothing in
  # it runs the repository's code: GitHub's checkout, rustup, the auth action (rust-lang's,
  # pinned), and cargo of RUSTUP_TOOLCHAIN packing this commit's files with --no-verify (no
  # build, so no build script; the build was ci's `cargo publish --dry-run --locked` on this
  # same commit, needs: ci). The repository's cargo and rustup configuration would run too (a
  # toolchain file can name its own binaries, a cargo config a credential provider that gets
  # the token), so a release refuses it, first, before any token exists.
  publish:
    needs: [ci, tag, guard] # ci: `cargo publish --dry-run --locked` on this same commit
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: crates-io
    permissions:
      contents: read
      id-token: write # the OIDC token crates.io exchanges; this job only
    env:
      # The Rust of ci.yml's dry run (the tag job checks the two agree). The variable wins
      # over any toolchain file.
      RUSTUP_TOOLCHAIN: 1.97.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: No cargo or rustup configuration from the repository
        run: |
          for f in .cargo/config .cargo/config.toml rust-toolchain rust-toolchain.toml; do
            if [ -e "$f" ] || [ -L "$f" ]; then echo "::error::$f in a release: refused"; exit 1; fi
          done

      - name: Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal

      # Fails the job with crates.io's reason when the Trusted Publishing configuration does
      # not match (owner, repository, workflow file, environment). Nothing runs between this
      # and the publish.
      - name: A crates.io token (Trusted Publishing)
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      - name: Publish on crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked --no-verify

  # The binaries on the GitHub Release, each built natively on a runner of its own
  # architecture with the publish job's Rust. glibc, as `cargo install` builds it, not a static
  # musl build: termdisk gives a scan's freed memory back with glibc's malloc_trim, and musl's
  # malloc made a 12-thread scan 1.7 times as slow (AGENTS.md, "Releases"). Ubuntu 22.04, not
  # 24.04: std calls pidfd_spawnp and pidfd_getpid only where libc has them, but linked against
  # 24.04's glibc 2.39, which has them, both binaries recorded glibc 2.39 as needed (the check
  # failed on aarch64; on x86_64 the same Rust did it locally with its LLD and with GNU ld), and
  # would not start on an older one. 22.04's glibc 2.35 lacks both, so a binary needs glibc
  # 2.34 or newer, as the README says; the check keeps that true.
  # This job runs the repository's code, so it gets nothing to write with and no secrets:
  # github-release attaches what it leaves.
  binaries:
    strategy:
      fail-fast: false # each target's check is seen, even when the other fails
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      RUSTUP_TOOLCHAIN: 1.97.1 # the publish job's (the tag job checks they agree)
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal

      - name: Build
        run: cargo build --release --locked --target "$TARGET"

      # It runs, and needs no glibc newer than 2.34. A version marked WEAK is not needed: std
      # uses what it names only where it is there.
      - name: Check
        run: |
          bin=target/$TARGET/release/termdisk
          "$bin" --version
          "$bin" --summary .
          glibc=$(readelf -V "$bin" | awk '/Name: GLIBC_/ && !/Flags: WEAK/ { sub("GLIBC_", "", $3); print $3 }' | sort -V | tail -1)
          test -n "$glibc" || { echo "::error::no GLIBC version found in $bin"; exit 1; }
          echo "needs glibc $glibc"
          test "$(printf '%s\n' "$glibc" 2.34 | sort -V | tail -1)" = 2.34 ||
            { echo "::error::the binary needs glibc $glibc, newer than the README's 2.34"; exit 1; }

      # The archive's names are the ones Cargo.toml's [package.metadata.binstall] expects. Beside
      # the binary, the notices THIRD-PARTY-LICENSES points to: the standard library's, from
      # this toolchain (its rustc component, so the minimal profile has it).
      - name: Archive
        run: |
          name=termdisk-$TARGET
          std_notices=$(rustc --print sysroot)/share/doc/rust/COPYRIGHT-library.html
          test -f "$std_notices" || { echo "::error::no $std_notices in this Rust"; exit 1; }
          mkdir "$name"
          cp "target/$TARGET/release/termdisk" LICENSE THIRD-PARTY-LICENSES "$std_notices" "$name/"
          tar -czf "$name.tar.gz" "$name"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: termdisk-${{ matrix.target }}
          path: termdisk-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  github-release:
    needs: [publish, binaries]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write # the only job that writes: it creates the Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The binaries job's archives: files to attach, nothing here runs them.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: termdisk-*
          path: ${{ runner.temp }}/assets
          merge-multiple: true

      - name: GitHub Release with this version's CHANGELOG section, the binaries and SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=${GITHUB_REF_NAME#v}
          # A whole release is left as it is. One cut off while uploading (a draft, or short of
          # the archives and SHA256SUMS) stops here: delete it (the tag stays), then "Re-run
          # failed jobs" makes it again.
          if release=$(gh release view "$GITHUB_REF_NAME" --json isDraft,assets 2> /dev/null); then
            assets=$(( $(find "$RUNNER_TEMP/assets" -name 'termdisk-*.tar.gz' | wc -l) + 1 ))
            if jq -e --argjson n "$assets" '.isDraft or (.assets | length) < $n' <<< "$release" > /dev/null; then
              echo "::error::the release $GITHUB_REF_NAME is a draft or lacks some of its $assets assets: delete it (gh release delete $GITHUB_REF_NAME) and re-run failed jobs"
              exit 1
            fi
            echo "::notice::the release $GITHUB_REF_NAME exists already: left as it is"
            exit 0
          fi
          awk -v h="## [$version]" 'index($0, h) == 1 { on = 1; next } /^## \[/ { on = 0 } on' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          cd "$RUNNER_TEMP/assets"
          sha256sum termdisk-*.tar.gz > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "termdisk $version" --notes-file "$RUNNER_TEMP/notes.md" \
            termdisk-*.tar.gz SHA256SUMS
